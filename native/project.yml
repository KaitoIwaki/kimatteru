# SwiftUI 版の Xcode プロジェクト。Mac が無いので、Xcode の画面で作らずに、この設定から XcodeGen で組み立てる
# （GitHub の Mac・Codemagic の上で `xcodegen generate`）。
name: LUKKO
options:
  bundleIdPrefix: com.kimatteru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LukkoKit:
    path: LukkoKit
targets:
  LUKKO:
    type: application
    platform: iOS
    sources: [LukkoApp]
    dependencies:
      - package: LukkoKit
      # ウィジェット（いまの版と同じ bundle ID・kind。ホーム画面に置いてあるウィジェットがそのまま動く）
      - target: KimatteruWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimatteru.app
        PRODUCT_NAME: LUKKO
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # ビルド番号は Codemagic で agvtool が振る（apple-generic が前提）
        VERSIONING_SYSTEM: apple-generic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LukkoApp/LUKKO.entitlements
        CODE_SIGN_STYLE: Manual
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LUKKO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 許可の説明は、いまの版（app/ios/App/App/Info.plist）と同じ文
        INFOPLIST_KEY_NSCalendarsUsageDescription: "いま使っているカレンダーの予定を、取り込みと「重ねて表示」のために読み込みます。書き込むのは、設定で「決まった予定を iPhone のカレンダーにも入れる」をオンにしたときだけで、「LUKKO」という名前のカレンダーにだけ書きます。外部への送信は行いません。"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "いま使っているカレンダーの予定を、取り込みと「重ねて表示」のために読み込みます。書き込むのは、設定で「決まった予定を iPhone のカレンダーにも入れる」をオンにしたときだけで、「LUKKO」という名前のカレンダーにだけ書きます。外部への送信は行いません。"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "アプリを開くときに、本人かどうかを確かめるために使います。"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  # ウィジェット拡張。中身は いまの版の app/ios/App/KimatteruWidget をそのまま持ってきたもの。
  # bundle ID（com.kimatteru.app.widget）・kind（KimatteruWidget）・App Group を変えると、
  # すでにホーム画面に置いてあるウィジェットが消える・何も出なくなる。変えないこと。
  KimatteruWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LukkoWidget
        excludes: [Info.plist, "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimatteru.app.widget
        PRODUCT_NAME: KimatteruWidget
        # 版とビルド番号は本体と同じにする（ずれていると App Store が受け取らない。agvtool -all が両方を振る）
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        INFOPLIST_FILE: LukkoWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LUKKO
        CODE_SIGN_ENTITLEMENTS: LukkoWidget/KimatteruWidget.entitlements
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LUKKOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LukkoUITests]
    dependencies:
      - target: LUKKO
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
  # ストア画像のための、ウィジェットの絵だけを描く試験（アプリには入らない）。ウィジェットの部品をそのまま使う
  WidgetShots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WidgetShots
      - path: LukkoWidget/KimatteruWidget.swift
    dependencies:
      - package: LukkoKit
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_SHOTS"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
schemes:
  LUKKO:
    build:
      targets:
        LUKKO: all
        LUKKOUITests: [test]
        WidgetShots: [test]
    test:
      targets: [LUKKOUITests, WidgetShots]
