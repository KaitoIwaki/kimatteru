# SwiftUI 版を GitHub の Mac で確かめる：中身のテスト（kit）と、アプリのビルド＋シミュレーターの試験と写真（app）を並べて走らせる
# 結果（テストの記録と写真）は artifacts に置く。手元から gh で取り出して見る。
name: native
on:
  push:
    branches: [swiftui, 'sw-*']
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

# 新しい変更が来たら、前の確かめは止める（最新の変更に全部の試験が入っているので）
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: 中身のテスト（LukkoKit）
        working-directory: native/LukkoKit
        # パイプでつなぐと失敗が隠れる（tee が成功を返す）。pipefail で、試験の失敗をこの段の失敗にする
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../kit-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-results
          path: kit-test.log

  app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -20
      - name: プロジェクトを組み立てる
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate
      # TestFlight と同じ「実機向け・リリース」の形で通るか（署名はしない）
      - name: 実機向けのリリースビルド
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild build -project LUKKO.xcodeproj -scheme LUKKO -configuration Release -sdk iphoneos -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../release-build.log | tail -30
      - name: 画面の試験と写真（シミュレーター）
        working-directory: native
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro \(|iPhone 1[6-9] \(" | grep -v Max | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "device: $DEV"
          # ストア画像のために、上の時刻を 9:41・電波と電池を満タンにしておく（Apple の見本と同じ）
          xcrun simctl boot "$DEV" || true
          xcrun simctl status_bar booted override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100 || true
          set -o pipefail
          xcodebuild test -project LUKKO.xcodeproj -scheme LUKKO -destination "platform=iOS Simulator,name=$DEV" -resultBundlePath ../ui.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../ui-test.log | tail -60
      - name: 写真を取り出す
        if: always()
        run: |
          mkdir -p shots
          if [ -d ui.xcresult ]; then
            xcrun xcresulttool export attachments --path ui.xcresult --output-path shots || true
          fi
          ls -la shots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-results
          path: |
            shots
            ui-test.log
            release-build.log

  # 宣伝の動画のための録画。コミットの文に [promo] があるときだけ動く（ふだんの確かめには入れない）
  promo:
    if: contains(github.event.head_commit.message, '[promo]')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: プロジェクトを組み立てる
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 動かしながら録画する
        working-directory: native
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro \(|iPhone 1[6-9] \(" | grep -v Max | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "device: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl status_bar booted override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100 || true
          xcodebuild build-for-testing -project LUKKO.xcodeproj -scheme LUKKO -destination "platform=iOS Simulator,name=$DEV" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5
          xcrun simctl io booted recordVideo --codec=h264 --force ../promo.mov &
          REC=$!
          sleep 3
          python3 -c 'import time; print(time.time())' > ../promo-start.txt
          TEST_RUNNER_LUKKO_PROMO=1 xcodebuild test-without-building -project LUKKO.xcodeproj -scheme LUKKO -destination "platform=iOS Simulator,name=$DEV" -only-testing:LUKKOUITests/StoreShots/testPromoRecording -resultBundlePath ../promo.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20 || true
          sleep 1
          kill -INT $REC || true
          wait $REC || true
          ls -la ../promo.mov
      - name: 目印を取り出す
        if: always()
        run: |
          mkdir -p promo-marks
          if [ -d promo.xcresult ]; then xcrun xcresulttool export attachments --path promo.xcresult --output-path promo-marks || true; fi
          ls -la promo-marks | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo
          path: |
            promo.mov
            promo-start.txt
            promo-marks
