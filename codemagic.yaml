workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kimatteru.app"
      # Codemagic の Teams > Integrations で App Store Connect の鍵を登録し、
      # その名前をここに書く（下の名前は仮）
      integrations:
        app_store_connect: kimatteru_asc_key
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kimatteru.app
    scripts:
      - name: 依存関係をインストール
        script: npm --prefix app ci
      - name: Web をビルド
        script: npm --prefix app run build
      - name: Capacitor を同期（dist を iOS プロジェクトへ）
        script: |
          cd app
          npx cap sync ios
      - name: ビルド番号を採番
        script: |
          cd app/ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: 署名プロファイルを適用
        script: xcode-project use-profiles
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # まずは TestFlight まで。審査提出は App Store Connect の画面から手動で行う
        submit_to_testflight: true
