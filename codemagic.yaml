workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Codemagic の Settings > Integrations > Developer Portal に登録した鍵の名前。
    # environment の中ではなくワークフロー直下に置く決まりになっている。
    integrations:
      app_store_connect: App Store Connect API key
    environment:
      xcode: latest
      # Capacitor 8 の CLI は Node 22 以上を要求する
      node: 22
      # Codemagic の Environment variables で作るグループ。
      # CERTIFICATE_PRIVATE_KEY（配布証明書の秘密鍵）を secure で入れておく。
      groups:
        - signing
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kimatteru.app"
      # ios_signing は既存のプロファイルを探すだけで、無いときに作ってくれない。
      # 下の「署名の準備」で --create 付きで取得する。
    scripts:
      - name: 署名ファイルを取得（無ければ作成）
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: 依存関係をインストール
        script: npm --prefix app ci
      - name: Web をビルド
        script: npm --prefix app run build
      - name: Capacitor を同期（dist を iOS プロジェクトへ）
        script: |
          cd app
          npx cap sync ios
      # agvtool は VERSIONING_SYSTEM = "apple-generic" が前提。
      # これが無いと採番が黙って効かず、ビルド番号が 1 のままになる。
      # 同じ 版＋ビルド番号 は App Store Connect が重複として弾くので、
      # IPA のビルドは成功したまま TestFlight に現れない、という形で出る。
      # 何番を振ったかを必ずログに残し、思ったとおりでなければここで落とす。
      - name: ビルド番号を採番
        script: |
          cd app/ios/App
          if [ -z "$PROJECT_BUILD_NUMBER" ]; then
            echo "✗ PROJECT_BUILD_NUMBER が空。採番できないので止める。"
            exit 1
          fi
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
          STAMPED=$(agvtool what-version -terse | tr -d '[:space:]')
          MARKETING=$(agvtool what-marketing-version -terse1 | tr -d '[:space:]')
          echo "▶ 振ったビルド番号: $STAMPED（期待値 $PROJECT_BUILD_NUMBER）"
          echo "▶ 表示バージョン:   $MARKETING"
          if [ "$STAMPED" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "✗ 採番に失敗している。このまま上げても重複で弾かれるので、ここで止める。"
            exit 1
          fi
      # cap sync がプロジェクトを書き換えるので、署名の適用はその後に行う
      - name: 署名プロファイルを適用
        script: xcode-project use-profiles
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      # publishing: ブロックに任せると post-processing 扱いになり、
      # 失敗しても理由が途中で切れて読めない（ビルド20・21がこれで詰まった）。
      # 同じことを普通のステップでやって、出力を全部ログに残す。
      # Apple の API 変更に CLI が追いついていないと、アップロードが済んで
      # Processing state: VALID になったあとの buildBetaDetail 取得が
      #   404 There is no resource of type 'buildBetaDetails' with id '<ビルドのID>'
      # で落ちる（ビルドのIDを buildBetaDetails のIDとして探しにいってしまう）。
      # バイナリは無事なのに配信が失敗扱いになるので、まず CLI を上げておく。
      - name: 配信ツールを最新にする
        script: |
          pip3 install --upgrade codemagic-cli-tools || echo "▶ 更新できなかったので既存のまま進む"
          echo "▶ app-store-connect のバージョン: $(app-store-connect --version 2>&1)"
      - name: TestFlight へ配信
        script: |
          set -x
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "▶ 配信するIPA: $IPA"
          if app-store-connect publish \
               --path "$IPA" \
               --testflight \
               --beta-group "自分用" \
               --max-build-processing-wait 30; then
            echo "▶ 配信まで完了"
          else
            echo "✗ 配信ステップが失敗した。"
            echo "  ただし Processing state: VALID まで出ていれば、バイナリは"
            echo "  App Store Connect に届いている。TestFlight の一覧に出ているので、"
            echo "  内部テストグループ「自分用」に手で追加すれば実機に配信できる。"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # 配信は上の「TestFlight へ配信」ステップで行うので、publishing は使わない。
    # （publishing にすると失敗理由が post-processing に隠れて読めない）
