workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Codemagic の Settings > Integrations > Developer Portal に登録した鍵の名前。
    # environment の中ではなくワークフロー直下に置く決まりになっている。
    integrations:
      app_store_connect: App Store Connect API key
    environment:
      xcode: latest
      # Capacitor 8 の CLI は Node 22 以上を要求する
      node: 22
      # Codemagic の Environment variables で作るグループ。
      # CERTIFICATE_PRIVATE_KEY（配布証明書の秘密鍵）を secure で入れておく。
      groups:
        - signing
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kimatteru.app"
      # ios_signing は既存のプロファイルを探すだけで、無いときに作ってくれない。
      # 下の「署名の準備」で --create 付きで取得する。
    scripts:
      - name: 署名ファイルを取得（無ければ作成）
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: 依存関係をインストール
        script: npm --prefix app ci
      - name: Web をビルド
        script: npm --prefix app run build
      - name: Capacitor を同期（dist を iOS プロジェクトへ）
        script: |
          cd app
          npx cap sync ios
      # agvtool は VERSIONING_SYSTEM = "apple-generic" が前提。
      # これが無いと採番が黙って効かず、ビルド番号が 1 のままになる。
      # 同じ 版＋ビルド番号 は App Store Connect が重複として弾くので、
      # IPA のビルドは成功したまま TestFlight に現れない、という形で出る。
      # 何番を振ったかを必ずログに残し、思ったとおりでなければここで落とす。
      - name: ビルド番号を採番
        script: |
          cd app/ios/App
          if [ -z "$PROJECT_BUILD_NUMBER" ]; then
            echo "✗ PROJECT_BUILD_NUMBER が空。採番できないので止める。"
            exit 1
          fi
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
          STAMPED=$(agvtool what-version -terse | tr -d '[:space:]')
          MARKETING=$(agvtool what-marketing-version -terse1 | tr -d '[:space:]')
          echo "▶ 振ったビルド番号: $STAMPED（期待値 $PROJECT_BUILD_NUMBER）"
          echo "▶ 表示バージョン:   $MARKETING"
          if [ "$STAMPED" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "✗ 採番に失敗している。このまま上げても重複で弾かれるので、ここで止める。"
            exit 1
          fi
      # cap sync がプロジェクトを書き換えるので、署名の適用はその後に行う
      - name: 署名プロファイルを適用
        script: xcode-project use-profiles
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      # ここは「アップロードするだけ」。テスターへ配るところまではやらない。
      #
      # 過去に3通り試して、いずれも Apple 側に断られた（ビルド20〜28）。
      #   publishing: ブロック  → post-processing 扱いで、失敗理由が途中で切れて読めない
      #   publish --testflight → GET /v1/builds/<ID>/buildBetaDetail が 404
      #   beta-groups add-build → Builds cannot be assigned to this internal group.
      #                           - Cannot add internal group to a build.
      #
      # 最後のエラーが答えで、**内部テストグループにビルドを外から割り当てることは
      # Apple が許していない**。配信するかどうかは、グループ側の設定が決める。
      #
      #   App Store Connect → TestFlight → 内部テストグループ → Settings
      #     → Build Distribution
      #
      # ここが「Xcode から上げたビルドだけ」になっていると、
      # Codemagic のように API で上げたビルドは配られない。
      # 配信されないときは、コードではなくこの設定を見ること。
      - name: App Store Connect へアップロード
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "▶ アップロードするIPA: $IPA"
          app-store-connect publish --path "$IPA"
          echo "▶ アップロード完了。処理が終わりしだい TestFlight に現れる。"
          echo "  テスターへ配るかどうかは、内部テストグループの"
          echo "  Build Distribution の設定が決める（APIからは指定できない）。"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # 配信は上のステップで行うので publishing は使わない
    # （publishing にすると失敗理由が post-processing に隠れて読めない）
