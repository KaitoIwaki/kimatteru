workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Codemagic の Settings > Integrations > Developer Portal に登録した鍵の名前。
    # environment の中ではなくワークフロー直下に置く決まりになっている。
    integrations:
      app_store_connect: App Store Connect API key
    environment:
      xcode: latest
      node: 20
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kimatteru.app"
      # ios_signing は既存のプロファイルを探すだけで、無いときに作ってくれない。
      # 下の「署名の準備」で --create 付きで取得する。
    scripts:
      - name: 署名ファイルを取得（無ければ作成）
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: 依存関係をインストール
        script: npm --prefix app ci
      - name: Web をビルド
        script: npm --prefix app run build
      - name: Capacitor を同期（dist を iOS プロジェクトへ）
        script: |
          cd app
          npx cap sync ios
      - name: ビルド番号を採番
        script: |
          cd app/ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      # cap sync がプロジェクトを書き換えるので、署名の適用はその後に行う
      - name: 署名プロファイルを適用
        script: xcode-project use-profiles
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # まずは TestFlight まで。審査提出は App Store Connect の画面から手動で行う
        submit_to_testflight: true
